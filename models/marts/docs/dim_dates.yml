version: 2

models:
  - name: dim_dates
    description: Date dimension spanning the activity window and registered as the daily MetricFlow time spine.
    time_spine:
      standard_granularity_column: date_day
    config:
      contract:
        enforced: true
    columns:
      - name: date_day
        data_type: date
        description: Primary key — calendar day.
        data_tests: [unique, not_null]
        granularity: day
      - name: date_key
        data_type: integer
        description: Integer surrogate key (YYYYMMDD).
      - name: calendar_year
        data_type: integer
      - name: calendar_quarter
        data_type: integer
      - name: calendar_month
        data_type: integer
      - name: month_name
        data_type: varchar
      - name: day_of_month
        data_type: integer
      - name: day_of_week
        data_type: integer
      - name: day_name
        data_type: varchar
      - name: is_weekend
        data_type: boolean
