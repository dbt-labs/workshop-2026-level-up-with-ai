version: 2

models:
  - name: fct_payments
    description: Payment-attempt-grain fact — one row per payment attempt.
    config:
      contract:
        enforced: true
    columns:
      - name: payment_id
        data_type: varchar
        description: Primary key — payment identifier.
        data_tests: [unique, not_null]
      - name: order_id
        data_type: varchar
        description: FK to fct_orders.
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: customer_id
        data_type: varchar
        description: FK to dim_wizards (denormalized from order).
      - name: payment_method
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: [coin, guild_credit, crystal_transfer, barter]
      - name: payment_status
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: [success, failed, refunded]
      - name: amount_gold
        data_type: number(38, 2)
      - name: paid_at
        data_type: timestamp_ntz
      - name: paid_date
        data_type: date
